<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CGT 3D Logo — Member C UI</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="container">
    <div id="leftPane">
      <canvas id="glCanvas"></canvas>
    </div>

    <div id="rightPane">
      <h2>Control Panel</h2>

      <!-- FRONT COLOR -->
      <div class="group">
        <label>Front Color</label><br>
        <input type="color" id="frontColorPicker" value="#000033">
        <div class="colorModeButtons">
          <button id="frontSolidBtn">Solid</button>
          <button id="frontGradBtn">Gradient</button>
        </div>
      </div>

      <!-- BACK COLOR -->
      <div class="group">
        <label>Back Color</label><br>
        <input type="color" id="sideColorPicker" value="#0000A3">
        <div class="colorModeButtons">
          <button id="backSolidBtn">Solid</button>
          <button id="backGradBtn">Gradient</button>
        </div>
      </div>

      <!-- BACKGROUND COLOR -->
      <div class="group">
        <label>Background Color</label><br>
        <input type="color" id="bgColorPicker" value="#e9eef3">
      </div>

      <hr/>

      <!-- SCALE -->
      <div class="group">
        <label>Size (Scale)</label><br>
        <input type="range" id="sizeSlider" min="0.4" max="2.0" step="0.01" value="1.0">
        <span id="sizeValue">1.00</span>
      </div>

      <!-- SPEED -->
      <div class="group">
        <label>Animation Speed</label><br>
        <input type="range" id="speedSlider" min="0.1" max="3.0" step="0.05" value="1.0">
        <span id="speedValue">1.00</span>
      </div>

      <!-- DEPTH -->
      <div class="group">
        <label>Extrusion Depth</label><br>
        <input type="range" id="depthSlider" min="0.05" max="0.5" step="0.01" value="0.15">
        <span id="depthValue">0.15</span>
      </div>

      <!-- ROTATION -->
      <div class="group">
        <label>Rotation Direction</label><br>
        <select id="rotateDir">
          <option value="right">Rotate Right</option>
          <option value="left">Rotate Left</option>
        </select>
      </div>

      <!-- CONTROLS -->
      <div class="group buttons">
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
        <button id="resetBtn" class="control-btn">Reset</button>
      </div>
    </div>
  </div>

  <!-- gl-matrix -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>

  <!-- Geometry & animation -->
  <script src="geometry.js"></script>
  <script src="animation.js"></script>

  <!-- UI -->
  <script src="ui.js"></script>

  <!-- Lighting -->
  <script src="lighting.js"></script>

  <!-- Main drawing & shaders -->
  <script src="script.js"></script>
</body>
</html>
