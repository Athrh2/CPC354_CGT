<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CGT 3D Word Logo - Animated TV Ident</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>CGT 3D Word Logo</h2>
  <canvas id="glcanvas" width="800" height="600"></canvas>

  <!-- UI Controls -->
  <div id="controls">
    <label>Color: <input type="color" id="colorPicker" value="#00aaff"></label>
    <label>Speed: <input type="range" id="speedSlider" min="0.5" max="3" value="1" step="0.1"></label>
    <button id="startBtn">Start Animation</button>
    <button id="stopBtn">Stop Animation</button>
  </div>

  <!-- Script order matters -->
  <script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/dist/gl-matrix-min.js"></script>
  <script src="geometry.js"></script>
  <script src="animation.js"></script>
  <script src="ui.js"></script>
  <script src="lighting.js"></script>
  <script src="script.js"></script>
</body>
</html>
